name: Refresh reference

on:
  # Manual trigger from the Actions tab ("Run workflow" button)
  workflow_dispatch:
  schedule:
    # Every Sunday at 06:00 UTC
    - cron: "0 6 * * 0"
  push:
    branches: [main]
    paths:
      - packages.yml
      - scripts/build.R
      - .github/workflows/refresh.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R deps
        run: |
          install.packages(c("yaml", "jsonlite"), repos = "https://packagemanager.posit.co/cran/__linux__/jammy/latest")
        shell: Rscript {0}

      - name: Build reference
        run: Rscript scripts/build.R

      - name: Commit changes
        run: |
          git config user.name  "giotto-reference-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reference llms.txt llms-full.txt
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh reference $(date -u +%Y-%m-%d)"
            git push
          fi
