# Packages to index. Edit this list to add/remove packages.
#
# Each entry may be:
#   - a string (short form): repo name under `org`
#   - an object: { name: <repo>, org: <org>, ref: <branch/tag/sha> }
#     org/ref are optional and inherit from the defaults below.

org: giotto-suite
ref: main

# By default only documented + exported (per NAMESPACE) functions are included.
# Set true here for all packages, or per-package below, to include internal helpers too.
include_internal: false

packages:
  - name: Giotto
    ref: suite
    # Additional vignette-only sources. Each entry may be a string
    # "<owner>/<repo>" (defaults: ref=main, path=vignettes) or an object
    # with explicit fields. Copied into reference/<pkg>/vignettes/<repo>/.
    extra_vignettes:
      - giotto-suite/Giotto_website
  - GiottoClass
  - GiottoUtils
  - GiottoVisuals
